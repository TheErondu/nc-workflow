<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Offline — NC Workflow</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #1a1a2e;
            color: #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 2rem;
        }
        .icon { font-size: 4rem; margin-bottom: 1rem; }
        h1 { color: #fff; font-size: 1.5rem; margin-bottom: 0.5rem; }
        p { margin-bottom: 1.5rem; font-size: 0.95rem; }
        button {
            background: #272727;
            color: #fff;
            border: 1px solid #555;
            padding: 0.6rem 1.5rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
        }
        button:hover { background: #444; }
    </style>
</head>
<body>
    <div>
        <div class="icon">📡</div>
        <h1>You're offline</h1>
        <p>NC Workflow can't reach the server right now.<br>Check your connection and try again.</p>
        <button onclick="window.location.reload()">Retry</button>
    </div>
</body>
</html>
